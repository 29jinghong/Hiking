<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mountain Journey · Song of the Hills</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>
<body>
  <header class="hero">
    <h1>Mountain Journey</h1>
    <p>Together, we rise — one step, one trail, one story at a time.</p>
  </header>

  <main>
    <section class="section">
      <h2>Trail Map</h2>
      <div id="map"></div>
    </section>

    <section class="section">
      <h2>All Trails</h2>
      <div id="trail-grid" class="trail-grid"></div>
    </section>

    <section class="about-section">
      <h2>About Our Journey</h2>
      <p>
        We are a group of friends exploring Georgia's hills, canyons, and ridges,
        one adventure at a time.
      </p>
    </section>
  </main>

  <footer>
    <p>© 2026 Mountain Journey | Made by Jinghong Wang</p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/trails.js"></script>
  <script>
    const trailGrid = document.getElementById("trail-grid");

    trails.forEach(trail => {
      const card = document.createElement("a");
      card.className = "trail-card";
      card.href = `trail.html?slug=${trail.slug}`;
      card.innerHTML = `
        <img src="${trail.cover}" alt="${trail.name}">
        <div class="trail-card-content">
          <h3>${trail.name}</h3>
          <p>${trail.shortDescription}</p>
        </div>
      `;
      trailGrid.appendChild(card);
    });

    const map = L.map("map").setView([33.9, -84.4], 7);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    trails.forEach(trail => {
      L.marker([trail.lat, trail.lng])
        .addTo(map)
        .bindPopup(`
          <strong>${trail.name}</strong><br>
          ${trail.shortDescription}<br>
          <a href="trail.html?slug=${trail.slug}">Open page</a>
        `);
    });
  </script>
</body>
</html>
